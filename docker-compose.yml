# Local Postgres with the pgvector extension, for running the full pipeline.
#   docker compose up -d
# DATABASE_URL=postgres://postgres:postgres@localhost:5433/neighbourhood_os
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neighbourhood_os
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neighbourhood_os"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
